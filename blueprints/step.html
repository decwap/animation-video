<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<!--
  blueprint: step
  purpose: one numbered step of a how-to: step chip and progress, a short title, one supporting object.
  slots: step/total; title (<em> accent); any object (window with chat here); the big outline numeral
  when: each step of a "how to" or "N steps" video.
  timing: data-at takes a spoken word ("script"), "word#2", a line ("L3"), seconds ("1.2s"), or start/end with +/- seconds.
  copy this file into scenes/, rename data-composition-id to the scene id, change the words, keep the structure.
-->
</head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    [data-composition-id="step"] .bg-num { position: absolute; right: 40px; top: 260px; font: 900 900px/1 var(--av-display); color: transparent; -webkit-text-stroke: 5px var(--av-accent); opacity: 0.16; }
  </style>
  <div id="root" data-composition-id="step" data-width="1080" data-height="1920">
    <div class="bg-num" aria-hidden="true">2</div>
    <div class="av-stage">
      <av-progress id="prog" step="2" total="7" data-at="start+0.1"></av-progress>
      <av-headline id="title" size="l" data-at="start+0.3">Write a <em>prompt</em></av-headline>
      <av-window id="win" title="Claude" data-at="1.1s">
        <av-chat id="chat" messages="user: Edit my video: cut on the beat, bold captions, fast motion." data-at="1.5s"></av-chat>
      </av-window>
    </div>
  </div>
</template>
</body>
</html>
